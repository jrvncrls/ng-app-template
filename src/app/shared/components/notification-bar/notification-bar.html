@if (topNotifications().length > 0) {
  <div class="notification-bar notification-bar--top">
    @for (notification of topNotifications(); track notification.id) {
      <div class="notification-bar__item" [class]="'notification-bar__item--' + notification.type">
        <i
          class="notification-bar__icon"
          [class]="'uil ' + icons[notification.type]"
          aria-hidden="true"
        ></i>
        <span class="notification-bar__message">{{ notification.message }}</span>
        <button
          type="button"
          class="notification-bar__dismiss"
          aria-label="Dismiss"
          (click)="dismiss(notification.id)"
        >
          <i class="uil uil-times" aria-hidden="true"></i>
        </button>
      </div>
    }
  </div>
}

@if (bottomNotifications().length > 0) {
  <div class="notification-bar notification-bar--bottom">

}
