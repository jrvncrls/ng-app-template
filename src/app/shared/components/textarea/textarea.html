<label class="textarea">
  @if (label()) {
    <span class="textarea__label">
      {{ label() }}
      @if (isRequired()) {
        <span class="text-error" aria-hidden="true">*</span>
      }
    </span>
  }

  <textarea
    class="textarea__field"
    [class.textarea__field--invalid]="errorMessage()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-required]="isRequired() || null"
    [value]="value()"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
  ></textarea>

  @if (errorMessage(); as message) {
    <span class="textarea__error">{{ message }}</span>
  }
</label>
