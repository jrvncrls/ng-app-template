<div class="select">
  @if (label()) {
    <span class="select__label" [id]="labelId">
      {{ label() }}
      @if (isRequired()) {
        <span class="text-error" aria-hidden="true">*</span>
      }
    </span>
  }

  <div
    class="select__control"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    (focusout)="handleFocusOut($event)"
  >
    <button
      #trigger
      type="button"
      class="select__trigger"
      [class.select__trigger--open]="open()"
      [class.select__trigger--clearable]="showClear()"
      [class.select__trigger--invalid]="errorMessage()"
      role="combobox"
      aria-haspopup="listbox"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? listboxId : null"
      [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
      [attr.aria-labelledby]="label() ? labelId : null"
      [attr.aria-required]="isRequired() || null"
      [disabled]="disabled()"
      (click)="toggle()"
      (keydown)="handleKeydown($event)"
    >
      <span class="select__value" [class.select__value--placeholder]="!selectedOption()">
        {{ selectedOption()?.label ?? placeholder() }}
      </span>
      <i class="select__chevron uil uil-angle-down" aria-hidden="true"></i>
    </button>

    @if (showClear()) {
      <button
        type="button"
        class="select__clear"
        [attr.aria-label]="clearLabel()"
        (click)="clear()"
      >
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    }

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="open()"
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
      (overlayOutsideClick)="handleOutsideClick($event)"
    >
      <ul
        class="select__panel"
        role="listbox"
        [id]="listboxId"
        [attr.aria-labelledby]="label() ? labelId : null"
        (mousedown)="$event.preventDefault()"
      >
        @for (option of options(); track option.value; let i = $index) {
          <li role="presentation">
            <button
              type="button"
              role="option"
              tabindex="-1"
              class="select__option"
              [id]="optionId(i)"
              [class.select__option--active]="i === activeIndex()"
              [class.select__option--selected]="option.value === value()"
              [attr.aria-selected]="option.value === value()"
              (click)="selectOption(option)"
              (mouseenter)="activeIndex.set(i)"
            >
              <span>{{ option.label }}</span>
              @if (option.value === value()) {
                <i class="select__check uil uil-check" aria-hidden="true"></i>
              }
            </button>
          </li>
        }
      </ul>
    </ng-template>
  </div>

  @if (errorMessage(); as message) {
    <span class="select__error">{{ message }}</span>
  }
</div>
